name: Build & Release APK

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit count drives versionCode/versionName.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Publish to kosht-builds
        uses: softprops/action-gh-release@v2
        with:
          # Releases live in the dedicated builds repository.
          # Requires a repo-scoped PAT saved as the BUILDS_TOKEN secret.
          repository: ${{ github.repository_owner }}/kosht-builds
          token: ${{ secrets.BUILDS_TOKEN }}
          tag_name: kosht-build-${{ github.run_number }}
          name: Kosht build ${{ github.run_number }}
          body: |
            Automatic build from `${{ github.sha }}`.
            Download the `kosht-*.apk` below and open it on your phone to update.
          files: app/build/outputs/apk/release/kosht-*-release.apk
