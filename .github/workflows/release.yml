name: Build & Release APK

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit count drives versionCode/versionName.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Every published build must carry the same signature, otherwise the
      # in-app updater cannot install over the previous one. A runner's debug
      # key is generated per job, so falling back to it silently produced
      # releases that Android refused to install — fail loudly instead.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KOSHT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KOSHT_KEYSTORE_BASE64 is not set. Publishing a build" \
                 "signed with the runner's throwaway debug key would break" \
                 "in-app updates for everyone who already has Kosht installed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > kosht-release.jks
          echo "Release keystore restored."

      - name: Build release APK and AAB
        env:
          KOSHT_KEYSTORE_FILE: kosht-release.jks
          KOSHT_KEY_ALIAS: ${{ secrets.KOSHT_KEY_ALIAS }}
          KOSHT_STORE_PASSWORD: ${{ secrets.KOSHT_STORE_PASSWORD }}
          KOSHT_KEY_PASSWORD: ${{ secrets.KOSHT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Drop the keystore from the runner
        if: always()
        run: rm -f kosht-release.jks

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kosht build ${{ github.run_number }}
          body: |
            Automatic build from `${{ github.sha }}`.
            Download the `kosht-*.apk` below and open it on your phone to update.
            The `.aab` is the artifact to upload to Google Play / AppGallery.
          files: |
            app/build/outputs/apk/release/kosht-*-release.apk
            app/build/outputs/bundle/release/kosht-*-release.aab
