<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="A photographed receipt becomes a record: scan, read, save">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FA97B"/>
      <stop offset="1" stop-color="#176B4E"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FA97B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2FA97B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2FA97B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="slip">
      <rect x="78" y="52" width="132" height="150" rx="10"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="#7d8c85" stroke-opacity="0.35" stroke-width="1.5">
    <rect x="24" y="24" width="248" height="202" rx="18"/>
    <rect x="356" y="24" width="248" height="202" rx="18"/>
    <rect x="688" y="24" width="248" height="202" rx="18"/>
  </g>

  <g font-family="Segoe UI, Roboto, sans-serif" font-size="13" fill="#7d8c85">
    <text x="44" y="212">1 · Snap it</text>
    <text x="376" y="212">2 · Read on the phone</text>
    <text x="708" y="212">3 · Saved</text>
  </g>

  <g>
    <rect x="78" y="52" width="132" height="150" rx="10" fill="#f4faf7" stroke="#c9ddd4"/>
    <g stroke="#9fb3aa" stroke-width="5" stroke-linecap="round">
      <line x1="94" y1="72" x2="180" y2="72"/>
      <line x1="94" y1="90" x2="160" y2="90"/>
      <line x1="94" y1="108" x2="194" y2="108"/>
      <line x1="94" y1="126" x2="150" y2="126"/>
      <line x1="94" y1="144" x2="186" y2="144"/>
    </g>
    <line x1="94" y1="170" x2="194" y2="170" stroke="#176B4E" stroke-width="7" stroke-linecap="round"/>
    <g clip-path="url(#slip)">
      <rect x="78" y="40" width="132" height="46" fill="url(#sweep)">
        <animate attributeName="y" values="34;170;34" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="78" y="52" width="132" height="150" rx="10" fill="none" stroke="url(#brand)" stroke-width="2.5" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" values="0;-96" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="Segoe UI, Roboto, sans-serif">
    <g opacity="0">
      <rect x="392" y="60" width="176" height="34" rx="17" fill="url(#brand)"/>
      <text x="410" y="82" font-size="15" fill="#ffffff">Евроопт</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.4;0.9;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="392" y="104" width="130" height="34" rx="17" fill="#176B4E" fill-opacity="0.16" stroke="#176B4E" stroke-opacity="0.45"/>
      <text x="410" y="126" font-size="15" fill="#2FA97B">27.07.2026</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.52;0.9;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="392" y="148" width="112" height="34" rx="17" fill="#176B4E" fill-opacity="0.16" stroke="#176B4E" stroke-opacity="0.45"/>
      <text x="410" y="170" font-size="15" fill="#2FA97B">12,45 BYN</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.64;0.9;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <text x="536" y="170" font-size="12" fill="#7d8c85" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.64;0.72;0.9;1" dur="6s" repeatCount="indefinite"/>no cloud, no keys</text>
  </g>

  <g opacity="0">
    <rect x="712" y="86" width="200" height="78" rx="16" fill="#176B4E" fill-opacity="0.10" stroke="#176B4E" stroke-opacity="0.35"/>
    <circle cx="748" cy="125" r="18" fill="url(#brand)"/>
    <path d="M740 125 l6 6 l11 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Segoe UI, Roboto, sans-serif">
      <text x="778" y="120" font-size="15" fill="#2FA97B">Groceries</text>
      <text x="778" y="140" font-size="13" fill="#7d8c85">−12,45 BYN</text>
    </g>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.8;0.94;1" dur="6s" repeatCount="indefinite"/>
  </g>

  <g stroke="#7d8c85" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path id="hop1" d="M282 125 H346"/>
    <path id="hop2" d="M614 125 H678"/>
    <path d="M338 119 l8 6 l-8 6" stroke-linecap="round"/>
    <path d="M670 119 l8 6 l-8 6" stroke-linecap="round"/>
  </g>
  <circle r="4" fill="#2FA97B">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2;0.32;1" calcMode="linear">
      <mpath href="#hop1" xlink:href="#hop1"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#2FA97B">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.64;0.76;1" calcMode="linear">
      <mpath href="#hop2" xlink:href="#hop2"/>
    </animateMotion>
  </circle>
</svg>
